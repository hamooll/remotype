name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Remotype to do?
  - type: markdown
    attributes:
      value: |
        Note: features that need host permissions, content scripts or network access are unlikely to be accepted, because the low-privilege design is intentional.
