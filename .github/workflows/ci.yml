name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test-keymap.mjs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package extension
        run: |
          zip -r remotype-${GITHUB_REF_NAME}.zip \
            manifest.json background.js keymap.js i18n.js \
            popup.html popup.js popup.css sidepanel.html \
            README.md README.fa.md LICENSE
      - uses: softprops/action-gh-release@v2
        with:
          files: remotype-*.zip
          generate_release_notes: true
